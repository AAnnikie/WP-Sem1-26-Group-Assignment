<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Matrix</title>
    <link rel="stylesheet" href="titchfield-high-22-fort-george-st-port-antonio-css/titchfield-high-22-fort-george-st-port-antonio-styles.css">
</head>
<body data-role="Admin Viewer">
    <header>
        <nav class="nav-bar">
            <h1>Academic Matrix</h1>
            <ul class="nav-links">
                <li id="adminDashboardLink"><a href="titchfield-high-22-fort-george-st-port-antonio-admin.html">Admin Dashboard</a></li>

                <li><button id="logout">Log Out</button></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="matrix-layout">
            <aside class="matrix-side">
                <h2>Filter</h2>
                <label for="matrixSemester">Semester:</label>
                <select id="matrixSemester">
                    <option value="Semester 1">Semester 1</option>
                    <option value="Semester 2">Semester 2</option>
                    <option value="All">All Semesters</option>
                </select>
            </aside>

            <section class="matrix-main">
                <h2 id="matrixTitle"></h2>
                <p class="error" id="matrixMessage"></p>
                <div class="table-wrapper">
                    <table>
                        <thead id="matrixHeading"></thead>
                        <tbody id="matrixBody"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
