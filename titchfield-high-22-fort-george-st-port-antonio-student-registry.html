<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registry</title>
    <link rel="stylesheet" href="titchfield-high-22-fort-george-st-port-antonio-css/titchfield-high-22-fort-george-st-port-antonio-styles.css">
</head>
<body data-role="Admin Viewer">
    <header>
        <nav class="nav-bar">
            <h1>Student Registry</h1>
            <ul class="nav-links">
                <li id="adminDashboardLink"><a href="titchfield-high-22-fort-george-st-port-antonio-admin.html">Admin Dashboard</a></li>
                <li id="viewerDashboardLink" hidden><a href="titchfield-high-22-fort-george-st-port-antonio-viewer.html">Viewer Dashboard</a></li>
                <li><a href="titchfield-high-22-fort-george-st-port-antonio-student-registry.html">Student Registry</a></li>
                <li><a href="titchfield-high-22-fort-george-st-port-antonio-academic-matrix.html">Academic Matrix</a></li>
                <li><button id="logout">Log Out</button></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section id="formSection">
            <form id="studentForm" novalidate>
                <input type="hidden" id="editingStudentId">
                <fieldset>
                    <legend>Student Information</legend>
                    <div>
                        <label for="studentId">Student ID:</label>
                        <input type="text" id="studentId" name="studentId" required pattern="[A-Z][0-9]{4}" title="Student ID must start with a capital letter followed by 4 digits">
                        <p class="error" id="studentIdError"></p>
                    </div>
                    <div>
                        <label for="studentName">Full Name:</label>
                        <input type="text" id="studentName" name="studentName" required maxlength="60">
                        <p class="error" id="studentNameError"></p>
                    </div>
                    <div>
                        <label for="studentDob">Date of Birth:</label>
                        <input type="date" id="studentDob" name="studentDob" required>
                        <p class="error" id="studentDobError"></p>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Contact Information</legend>
                    <div>
                        <label for="studentPhone">Parent/Guardian Phone:</label>
                        <input type="tel" id="studentPhone" name="studentPhone" required pattern="[0-9]{10}" title="Phone number must contain exactly 10 digits">
                        <p class="error" id="studentPhoneError"></p>
                    </div>
                    <div>
                        <label for="studentEmail">Parent/Guardian Email:</label>
                        <input type="email" id="studentEmail" name="studentEmail" required>
                        <p class="error" id="studentEmailError"></p>
                    </div>
                    <div>
                        <label for="studentAddress">Address:</label>
                        <input type="text" id="studentAddress" name="studentAddress" required maxlength="100">
                        <p class="error" id="studentAddressError"></p>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Enrollment Information</legend>
                    <div>
                        <label for="academicYear">Academic Year:</label>
                        <input type="text" id="academicYear" name="academicYear" value="AY26/27" readonly>
                    </div>
                    <div>
                        <label for="studentSemester">Semester:</label>
                        <select id="studentSemester" name="studentSemester" required>
                            <option value="">Select a semester</option>
                            <option value="Semester 1">Semester 1</option>
                            <option value="Semester 2">Semester 2</option>
                        </select>
                        <p class="error" id="studentSemesterError"></p>
                    </div>
                    <div>
                        <label for="studentStatus">Status:</label>
                        <select id="studentStatus" name="studentStatus" required>
                            <option value="">Select a status</option>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                        <p class="error" id="studentStatusError"></p>
                    </div>
                </fieldset>

                <button type="submit" id="saveStudentButton">Add Student</button>
                <button type="reset" id="clearFormButton">Clear Form</button>
            </form>
        </section>

        <section id="tableSection">
            <h2>Registered Students</h2>
            <div class="filter-bar">
                <label for="semesterFilter">Show students in:</label>
                <select id="semesterFilter">
                    <option value="Semester 1">Semester 1</option>
                    <option value="Semester 2">Semester 2</option>
                    <option value="All">All Semesters</option>
                </select>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Date of Birth</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Semester</th>
                            <th>Status</th>
                            <th id="studentActionsHeading">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="titchfield-high-22-fort-george-st-port-antonio-js/titchfield-high-22-fort-george-st-port-antonio-guard.js"></script>
    <script src="titchfield-high-22-fort-george-st-port-antonio-js/titchfield-high-22-fort-george-st-port-antonio-storage.js"></script>
    <script src="titchfield-high-22-fort-george-st-port-antonio-js/titchfield-high-22-fort-george-st-port-antonio-seed.js"></script>
    <script src="titchfield-high-22-fort-george-st-port-antonio-js/titchfield-high-22-fort-george-st-port-antonio-admin-students.js"></script>
</body>
</html>
