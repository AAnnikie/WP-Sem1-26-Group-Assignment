File Purpose: HTML structure for the teacher dashboard page.
(Provides a subject selection dropdown, student table, and report card generation functionality.)

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Teacher Dashboard</title>

        <!--Shared Project Styles-->  
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="teacher.css">
    </head>

    <body data-role="Teacher">

        <header>
            <h1>Teacher Dashboard</h1>
            <h3>Welcome to the School Portal</h3>
        </header>

        <main>
            <h3>Selected Subject:</h3>

            <!--Subject selection dropdown-->
            <select id="subjectSelect">
                <option value="">Choose Subject</option>
            </select><br><br>

            <!-- Generates Student table-->
            <div id="studentTable"></div>

            <h3>Generate Report Card</h3>
            
            <!-- Student selection dropdown -->
            <select id="studentSelect">
                <option value="">Select Student</option>
            </select>

            <!-- Call js to generate report -->
            <button id="reportBtn">Generate Report</button>

            <!-- Generates Report card -->
            <div id="reportCard"></div>

            <button id="logout" >Logout</button>

        </main>
        
        <!-- JavaScript Files -->
        <script src="js/storage.js"></script>
        <script src="js/seed.js"></script>
        <script src="js/guard.js"></script>
        <script src="js/teacher.js"></script>
        
   
    </body>
</html>
